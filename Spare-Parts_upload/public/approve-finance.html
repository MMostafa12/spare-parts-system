<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance Approval</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: #f4f6f9; padding: 30px; }
.header { background: #1a3a5c; color: white; padding: 20px 30px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.header a { color: #c8a84b; text-decoration: none; font-weight: bold; }
.header .header-buttons { display: flex; gap: 20px; align-items: center; }
.header .header-buttons a { color: #c8a84b; text-decoration: none; font-weight: bold; }
.header .header-buttons a:hover { color: #e0c86b; }
.language-toggle { background: transparent; color: #c8a84b; border: 1px solid #c8a84b; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: inherit; }
.language-toggle:hover { background: #c8a84b; color: #1a3a5c; }
.filter-box { background: white; border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
.filter-box label { font-weight: bold; font-size: 12px; color: #333; display: block; margin-bottom: 4px; }
.filter-box input, .filter-box select { padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; width: 160px; }
.btn-filter { background: #1a3a5c; color: white; border: none; padding: 9px 20px; border-radius: 6px; cursor: pointer; }
.btn-filter:hover { background: #0f2a44; }
.btn-clear { background: #888; color: white; border: none; padding: 9px 20px; border-radius: 6px; cursor: pointer; margin-left: 8px; }
.btn-clear:hover { background: #666; }
.card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
th { background: #1a3a5c; color: white; padding: 8px; text-align: left; }
td { padding: 8px; border: 1px solid #ddd; }
h4 { color: #1a3a5c; margin-top: 20px; margin-bottom: 8px; }
.sig-box { border: 2px dashed #c8a84b; border-radius: 8px; padding: 20px; background: #fffdf0; margin-top: 15px; }
.rej-box { border: 2px dashed #c00; border-radius: 8px; padding: 20px; background: #fff0f0; margin-top: 15px; display: none; }
.rej-box.show { display: block; }
input[type=text], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 8px; font-size: 14px; font-family: Arial; }
input[readonly] { background: #f0f0f0; color: #555; cursor: not-allowed; }
textarea { height: 80px; resize: vertical; }
.btn-approve { background: #1e6b3c; color: white; border: none; padding: 12px 25px; border-radius: 7px; cursor: pointer; font-size: 14px; margin-top: 15px; margin-right: 10px; }
.btn-approve:hover { background: #155a2e; }
.btn-reject { background: #8b1a1a; color: white; border: none; padding: 12px 25px; border-radius: 7px; cursor: pointer; font-size: 14px; margin-top: 15px; }
.btn-reject:hover { background: #6b1414; }
.btn-print { background: #6c3483; color: white; padding: 12px 25px; border-radius: 7px; font-size: 14px; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; margin-right: 10px; font-family: Arial, Tahoma, sans-serif; }
.btn-print:hover { background: #552b66; }
.btn-confirm-reject { background: #8b1a1a; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; }
.btn-cancel-reject { background: #888; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-top: 10px; margin-left: 10px; }
.notes-display { background: #f9f9f9; border: 1px solid #ddd; border-radius: 6px; padding: 12px; font-size: 14px; color: #555; }
.error { color: red; margin-top: 10px; font-weight: bold; }
.success { color: #1e6b3c; margin-top: 10px; font-weight: bold; }
.reject-details { background: #fff0f0; border: 1px solid #ffcccc; border-radius: 6px; padding: 12px; margin: 15px 0; color: #8b1a1a; font-size: 13px; }
.status-bar { display: flex; align-items: center; margin-top: 15px; }
.step { display: flex; flex-direction: column; align-items: center; flex: 1; }
.step-circle { width: 36px; height: 36px; border-radius: 50%; background: #ddd; color: #999; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border: 3px solid #ddd; }
.step-circle.done { background: #1e6b3c; color: white; border-color: #1e6b3c; }
.step-circle.active { background: #c8a84b; color: white; border-color: #c8a84b; }
.step-circle.rejected { background: #8b1a1a; color: white; border-color: #8b1a1a; }
.step-circle.manager-step { background: #9b59b6; color: white; border-color: #9b59b6; }
.step-label { font-size: 11px; margin-top: 5px; color: #888; text-align: center; }
.step-label.done { color: #1e6b3c; font-weight: bold; }
.step-label.active { color: #c8a84b; font-weight: bold; }
.step-label.rejected { color: #8b1a1a; font-weight: bold; }
.step-label.manager-step { color: #9b59b6; font-weight: bold; }
.step-line { height: 4px; flex: 1; background: #ddd; margin-bottom: 20px; }
.step-line.done { background: #1e6b3c; }
.step-line.manager-step { background: #9b59b6; }
.auto-fill-note { font-size: 12px; color: #888; margin-top: 5px; }
</style>
</head>
<body>

<div class="header">
    <span data-i18n="app_title">Spare Parts System</span>
    <div class="header-buttons">
        <button id="language-toggle" onclick="toggleLanguage()" class="language-toggle">🌐 العربية</button>
        <a href="/change-password" data-i18n="common.change_password">🔑 Change Password</a>
        <a href="/logout" data-i18n="common.logout">Logout</a>
    </div>
</div>

<div class="filter-box">
    <div><label data-i18n="dashboard.filter.search">Search by Name</label><input type="text" id="filter_name" placeholder="Organization name..."></div>
    <div><label data-i18n="dashboard.filter.department">Department</label><select id="filter_dept">
        <option value="" data-i18n="common.all">All Departments</option>
        <option value="Angio">Angio</option>
        <option value="X-ray">X-ray</option>
        <option value="CT">CT</option>
        <option value="MRI">MRI</option>
        <option value="Konica">Konica</option>
        <option value="IT">IT</option>
        <option value="US">US</option>
        <option value="Projects">Projects</option>
        <option value="Sales">Sales</option>
    </select></div>
    <div><label data-i18n="dashboard.filter.from_date">From Date</label><input type="date" id="filter_from"></div>
    <div><label data-i18n="dashboard.filter.to_date">To Date</label><input type="date" id="filter_to"></div>
    <div><label data-i18n="dashboard.filter.status">Status</label><select id="filter_status">
        <option value="Pending Finance" data-i18n="dashboard.statuses.pending_finance">Pending Finance</option>
        <option value="" data-i18n="common.all">All</option>
        <option value="Pending Service" data-i18n="dashboard.statuses.pending_service">Pending Service</option>
        <option value="Pending Warehouse" data-i18n="dashboard.statuses.pending_warehouse">Pending Warehouse</option>
        <option value="Pending Dept Manager" data-i18n="dashboard.statuses.pending_dept_manager">Pending Dept Manager</option>
        <option value="Fulfilled" data-i18n="dashboard.statuses.fulfilled">Fulfilled</option>
        <option value="Rejected by Dept Manager" data-i18n="dashboard.statuses.rejected_by_dept_manager">Rejected by Dept Manager</option>
        <option value="Rejected by Service" data-i18n="dashboard.statuses.rejected_by_service">Rejected by Service</option>
        <option value="Rejected by Finance" data-i18n="dashboard.statuses.rejected_by_finance">Rejected by Finance</option>
        <option value="Rejected by Warehouse" data-i18n="dashboard.statuses.rejected_by_warehouse">Rejected by Warehouse</option>
    </select></div>
    <div><button class="btn-filter" onclick="applyFilter()" data-i18n="dashboard.filter.search_btn">Search</button><button class="btn-clear" onclick="clearFilter()" data-i18n="dashboard.filter.clear_btn">Clear</button></div>
</div>

<div id="requests-list">Loading requests...</div>

<script src="/js/language.js"></script>
<script>
function printRequest(id) {
    fetch('/approvals/print/' + id)
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data) {
            if (!data || !data.request) { alert('Could not load request details.'); return; }
            var req   = data.request;
            var items = data.items || [];

            var lang  = 'ar'; // FORCED ARABIC
            var isRTL = true; // FORCED ARABIC

            function esc(v) {
                if (v === null || v === undefined) return '';
                return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
            }
            function fmtDate(v) { if (!v) return ''; return String(v).substring(0, 10); }
            function fmtDateTime(v) {
                if (!v) return '';
                try {
                    var d = new Date(v);
                    if (isNaN(d.getTime())) return String(v).substring(0, 16);
                    var yyyy = d.getFullYear();
                    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
                    var dd = ('0' + d.getDate()).slice(-2);
                    var hh = ('0' + d.getHours()).slice(-2);
                    var mi = ('0' + d.getMinutes()).slice(-2);
                    return yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi;
                } catch (e) { return String(v).substring(0, 16); }
            }

            var acqDisplay = '';
            if (req.acquisition_type === 'Warranty') {
                acqDisplay = isRTL ? 'ضمان' : 'Warranty';
                if (req.acquisition_sub_type) {
                    var subMap = { 'System Warranty': isRTL ? 'ضمان الجهاز' : 'System Warranty', 'Parts Warranty': isRTL ? 'ضمان بيع قطع الغيار' : 'Parts Warranty' };
                    acqDisplay += ' - ' + (subMap[req.acquisition_sub_type] || req.acquisition_sub_type);
                }
                if (req.installation_date2) acqDisplay += (isRTL ? ' (تركيب: ' : ' (Install: ') + fmtDate(req.installation_date2) + ')';
            } else if (req.acquisition_type === 'Service Contract') {
                acqDisplay = isRTL ? 'عقد صيانة' : 'Service Contract';
                if (req.acquisition_sub_type) {
                    var subMap2 = { 'UPA Contract': isRTL ? 'عقد هيئة الشراء الموحد' : 'UPA Contract', 'Direct Contract': isRTL ? 'عقد مباشر' : 'Direct Contract' };
                    acqDisplay += ' - ' + (subMap2[req.acquisition_sub_type] || req.acquisition_sub_type);
                }
                if (req.contract_number) acqDisplay += (isRTL ? ' (عقد: ' : ' (Contract: ') + req.contract_number + ')';
            } else if (req.acquisition_type === 'Part Sales') acqDisplay = isRTL ? 'بيع قطع غيار' : 'Part Sales';
            else if (req.acquisition_type === 'Local Repair Parts') acqDisplay = isRTL ? 'إصلاح محلي' : 'Local Repair Parts';
            else if (req.acquisition_type === 'Tools') acqDisplay = isRTL ? 'أدوات' : 'Tools';
            else acqDisplay = esc(req.acquisition_type) || '-';

            function scrapLabel(v) {
                if (v === 'Y') return isRTL ? 'إرجاع' : 'Return';
                if (v === 'N') return isRTL ? 'تالف' : 'Scrap';
                return '';
            }

            var MIN_ROWS = 7;
            var totalRows = Math.max(MIN_ROWS, items.length);
            var partsRows = '';
            for (var i = 0; i < totalRows; i++) {
                var item = items[i] || null;
                var rowBg = (i % 2 === 1) ? 'style="background:#f5f7fa;"' : '';
                if (item) {
                    var scrap = scrapLabel(item.defective_status);
                    var scrapCell = scrap
                        ? '<td style="font-size:9px;font-weight:bold;color:#BA7517;padding:4px;border:0.4px solid #c5cdd8;text-align:center;">' + scrap + '</td>'
                        : '<td style="padding:4px;border:0.4px solid #c5cdd8;"></td>';
                    partsRows += '<tr ' + rowBg + '>' +
                        '<td style="font-size:10px;color:#6b7a8d;padding:4px;border:0.4px solid #c5cdd8;text-align:center;">' + (i + 1) + '</td>' +
                        '<td style="font-size:10px;padding:4px;border:0.4px solid #c5cdd8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">' + esc(item.part_name) + '</td>' +
                        '<td style="font-size:9.5px;font-family:\'Courier New\',monospace;padding:4px;border:0.4px solid #c5cdd8;">' + esc(item.part_number) + '</td>' +
                        '<td style="font-size:10px;color:#6b7a8d;padding:4px;border:0.4px solid #c5cdd8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">' + esc(item.po_number) + '</td>' +
                        '<td style="font-size:10px;padding:4px;border:0.4px solid #c5cdd8;text-align:center;">' + (item.quantity || '') + '</td>' +
                        '<td style="font-size:10px;color:#6b7a8d;padding:4px;border:0.4px solid #c5cdd8;text-align:center;">' + esc(item.warehouse_location) + '</td>' +
                        '<td style="font-size:9.5px;font-family:\'Courier New\',monospace;padding:4px;border:0.4px solid #c5cdd8;">' + esc(item.addition_permit_number) + '</td>' + scrapCell + '</tr>';
                } else {
                    partsRows += '<tr ' + rowBg + '>' +
                        '<td style="font-size:10px;color:#6b7a8d;padding:4px;border:0.4px solid #c5cdd8;text-align:center;">' + (i + 1) + '</td>' +
                        '<td style="padding:4px;border:0.4px solid #c5cdd8;"></td><td style="padding:4px;border:0.4px solid #c5cdd8;"></td>' +
                        '<td style="padding:4px;border:0.4px solid #c5cdd8;"></td><td style="padding:4px;border:0.4px solid #c5cdd8;"></td>' +
                        '<td style="padding:4px;border:0.4px solid #c5cdd8;"></td><td style="padding:4px;border:0.4px solid #c5cdd8;"></td>' +
                        '<td style="padding:4px;border:0.4px solid #c5cdd8;"></td></tr>';
                }
            }

            var L = {
                requestDetails: isRTL ? 'بيانات الطلب' : 'Request Details',
                orgCode: isRTL ? 'كود الجهة' : 'Organization Code',
                orgName: isRTL ? 'اسم الجهة' : 'Organization Name',
                department: isRTL ? 'القسم' : 'Department',
                requestDate: isRTL ? 'تاريخ الطلب' : 'Request Date',
                acquisitionType: isRTL ? 'نوع الصرف' : 'Acquisition Type',
                tempCustody: isRTL ? 'عهدة مؤقتة' : 'Temporary Custody',
                yes: isRTL ? 'نعم' : 'Yes',
                no: isRTL ? 'لا' : 'No',
                parts: isRTL ? 'القطع المطلوبة' : 'Parts',
                hPartName: isRTL ? 'اسم القطعة' : 'Part Name',
                hPartNumber: isRTL ? 'كود القطعة' : 'Part Number',
                hPONumber: isRTL ? 'رقم أمر الشراء' : 'PO Number',
                hQty: isRTL ? 'عدد' : 'QTY',
                hLoc: isRTL ? 'الرف' : 'Loc',
                hAddPermit: isRTL ? 'إذن الإضافة' : 'Add. Permit',
                hScrap: isRTL ? 'الحالة' : 'Scrap',
                notes: isRTL ? 'ملاحظات' : 'Notes',
                noNotes: isRTL ? 'لا توجد ملاحظات' : 'No notes added.',
                dispatch: isRTL ? 'الصرف' : 'Dispatch',
                dispatchDate: isRTL ? 'تاريخ الصرف' : 'Dispatch Date',
                dispatchPermit: isRTL ? 'رقم إذن الصرف' : 'Dispatch Permit Number',
                receivingEng: isRTL ? 'توقيع المستلم' : 'Receiving Engineer',
                defReturn: isRTL ? 'إعادة التالف' : 'Defective Return',
                returnDate: isRTL ? 'تاريخ الإعادة' : 'Return Date',
                addPermitNo: isRTL ? 'رقم إذن الإضافة' : 'Addition Permit Number',
                engSig: isRTL ? 'توقيع الإعادة' : 'Engineer Signature',
                signatures: isRTL ? 'الاعتماد' : 'Signatures',
                sigRequester: isRTL ? 'مقدم الطلب' : 'Requester',
                sigDeptManager: isRTL ? 'مدير القسم' : 'Dept Manager',
                sigService: isRTL ? 'إدارة الصيانة' : 'Service',
                sigFinance: isRTL ? 'الإدارة المالية' : 'Finance',
                sigWarehouse: isRTL ? 'المخزن' : 'Warehouse',
                footer: isRTL ? 'Spare Parts System - Medical Technology' : 'Medical Technology  |  Spare Parts System'
            };

            var now = new Date();
            var printedAt = fmtDate(now.toISOString()) + ', ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            var branchDisplay = req.branch === 'Alex' ? (isRTL ? 'الإسكندرية' : 'Alexandria') : (isRTL ? 'القاهرة' : 'Cairo');

            function sigCell(label, name, date, fullWidth) {
                var span = fullWidth ? 'colspan="2"' : '';
                return '<td ' + span + ' style="border:0.4px solid #c5cdd8;padding:4px 6px;vertical-align:top;">' +
                    '<div style="font-size:9.5px;color:#6b7a8d;margin-bottom:2px;">' + label + '</div>' +
                    '<div style="font-size:10px;font-weight:bold;">' + esc(name || '') + '</div>' +
                    '<div style="font-size:9.5px;color:#6b7a8d;margin-top:1px;">' + fmtDate(date) + '</div></td>';
            }
            function sectionTitle(text) {
                return '<div style="font-size:8px;font-weight:bold;color:#6b7a8d;letter-spacing:0.06em;text-transform:uppercase;border-bottom:0.5px solid #c5cdd8;padding-bottom:3px;margin-bottom:5px;margin-top:8px;">' + text + '</div>';
            }

            var notesCombined = '';
            if (req.notes && String(req.notes).trim() !== '') notesCombined += esc(req.notes);
            if (req.service_approval_notes && String(req.service_approval_notes).trim() !== '') notesCombined += '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #ccc;"><b style="color:#1a3a5c;">📝 Service Notes:</b> ' + esc(req.service_approval_notes) + '</div>';
            if (req.finance_approval_notes && String(req.finance_approval_notes).trim() !== '') notesCombined += '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #ccc;"><b style="color:#1e6b3c;">💵 Finance Notes:</b> ' + esc(req.finance_approval_notes) + '</div>';
            if (req.warehouse_approval_notes && String(req.warehouse_approval_notes).trim() !== '') notesCombined += '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #ccc;"><b style="color:#6c3483;">📦 Warehouse Notes:</b> ' + esc(req.warehouse_approval_notes) + '</div>';
            if (notesCombined === '') notesCombined = L.noNotes;

            var outsideHoursHtml = '';
            if (req.out_of_hours_release || req.out_of_hours_return) {
                outsideHoursHtml = '<div style="border:0.4px solid #e0a84c;background:#fff8e1;border-radius:4px;padding:5px 8px;font-size:10px;color:#8b5a00;min-height:22px;">';
                outsideHoursHtml += '<b>⚠️ Warehouse access outside operating hours</b>';
                outsideHoursHtml += '<div style="margin-top:4px;"><b>' + (isRTL ? '1. الصرف:' : '1. Part Release:') + '</b> ' + (req.out_of_hours_release ? (isRTL ? 'نعم' : 'Yes') : (isRTL ? 'لا' : 'No')) + (req.out_of_hours_release && req.out_of_hours_release_datetime ? ' — <b>' + esc(fmtDateTime(req.out_of_hours_release_datetime)) + '</b>' : '') + '</div>';
                outsideHoursHtml += '<div style="margin-top:2px;"><b>' + (isRTL ? '2. الإرجاع:' : '2. Part Return:') + '</b> ' + (req.out_of_hours_return ? (isRTL ? 'نعم' : 'Yes') : (isRTL ? 'لا' : 'No')) + (req.out_of_hours_return && req.out_of_hours_return_datetime ? ' — <b>' + esc(fmtDateTime(req.out_of_hours_return_datetime)) + '</b>' : '') + '</div>';
                outsideHoursHtml += '</div>';
            }

            var dir = isRTL ? 'rtl' : 'ltr';

            var html = '<!DOCTYPE html><html lang="' + lang + '" dir="' + dir + '"><head><meta charset="UTF-8"/>' +
                '<title>Spare Parts Request #' + req.id + '</title>' +
                '<style>' +
                '*{box-sizing:border-box;margin:0;padding:0;}' +
                'body{font-family:Arial,Tahoma,sans-serif;font-size:10pt;color:#1e2a38;background:#fff;padding:14mm;}' +
                '.no-print{text-align:center;margin-bottom:16px;}' +
                '.no-print button{background:#1a3a5c;color:white;border:none;padding:10px 28px;border-radius:6px;font-size:13px;cursor:pointer;}' +
                'table{width:100%;border-collapse:collapse;}' +
                '.parts-table{table-layout:fixed;}' +
                '.parts-table th{font-size:8.5pt;font-weight:bold;color:#6b7a8d;background:#f5f7fa;padding:3px 4px;border:0.4pt solid #c5cdd8;border-bottom:0.8pt solid #1a3a5c;vertical-align:middle;}' +
                '.dr-table th{font-size:8.5pt;font-weight:bold;color:#6b7a8d;background:#f5f7fa;padding:3px 6px;border:0.4pt solid #c5cdd8;border-bottom:0.6pt solid #1a3a5c;text-align:' + (isRTL ? 'right' : 'left') + ';width:33.3%;}' +
                '.footer{border-top:0.5pt solid #c5cdd8;padding-top:5px;margin-top:8px;display:flex;justify-content:space-between;font-size:10pt;color:#6b7a8d;}' +
                '@media print{.no-print{display:none;}body{padding:10mm;}@page{size:A4;margin:10mm;}}' +
                '</style></head><body>' +

                '<div class="no-print"><button onclick="window.print()">🖨 ' + (isRTL ? 'طباعة / حفظ كـ PDF' : 'Print / Save as PDF') + '</button></div>' +

                '<div style="border-bottom:1.5pt solid #1a3a5c;padding-bottom:6px;margin-bottom:8px;">' +
                '<div style="font-size:16pt;font-weight:bold;">' + (isRTL ? 'طلب صرف قطع غيار ' : 'Spare Parts Request ') + '<span style="color:#378ADD;">#' + req.id + '</span></div>' +
                '<div style="font-size:10pt;color:#6b7a8d;margin-top:2px;">' + fmtDate(req.request_date) + ' &nbsp;|&nbsp; ' + (isRTL ? 'الفرع: ' : 'Branch: ') + branchDisplay + '</div></div>' +

                sectionTitle(L.requestDetails) +
                '<table style="border-collapse:collapse;">' +

function renderNotesHtml(req) {

    };
    var html = '';

    }

        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #ccc;"><b style="color:#1e6b3c;">💵 Finance Notes:</b> ' + esc(req.finance_approval_notes) + '</div>';

function renderOutsideHoursHtml(req) {
    if (!req.out_of_hours_release && !req.out_of_hours_return) return '';
    var esc = function(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    };
    function fmtDateTime(v) {
        if (!v) return '-';
        try {
            var d = new Date(v);
            if (isNaN(d.getTime())) return String(v).substring(0, 16);
            var yyyy = d.getFullYear();
            var mm = ('0' + (d.getMonth() + 1)).slice(-2);
            var dd = ('0' + d.getDate()).slice(-2);
            var hh = ('0' + d.getHours()).slice(-2);
            var mi = ('0' + d.getMinutes()).slice(-2);
            return yyyy + '-' + mm + '-' + dd + ' ' + hh + ':' + mi;
        } catch (e) { return String(v).substring(0, 16); }
    }
    var html = '<div style="background:#fff8e1;border:1px solid #ffcc80;border-radius:6px;padding:12px;margin-top:12px;">';
    html += '<b style="color:#8b5a00;">⚠️ Warehouse access outside operating hours</b>';
    html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #e0a84c;">';
    html += '<b>1. Part Release:</b> ' + (req.out_of_hours_release ? '✅ Yes' : '❌ No');
    if (req.out_of_hours_release && req.out_of_hours_release_datetime) {
        html += ' &nbsp;—&nbsp; <b>' + esc(fmtDateTime(req.out_of_hours_release_datetime)) + '</b>';
    }
    html += '</div>';
    html += '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #e0a84c;">';
    html += '<b>2. Part Return:</b> ' + (req.out_of_hours_return ? '✅ Yes' : '❌ No');
    if (req.out_of_hours_return && req.out_of_hours_return_datetime) {
        html += ' &nbsp;—&nbsp; <b>' + esc(fmtDateTime(req.out_of_hours_return_datetime)) + '</b>';
    }
    html += '</div></div>';
    return html;
}

function getAcquisitionDisplay(req) {
    var isRTL = (typeof currentLanguage !== 'undefined') && currentLanguage === 'ar';
    var type = req.acquisition_type;

    if (type === 'Warranty') {
        var text = isRTL ? 'ضمان' : 'Warranty';
        if (req.acquisition_sub_type) {
            var subMap = { 'System Warranty': isRTL ? 'ضمان الجهاز' : 'System Warranty', 'Parts Warranty': isRTL ? 'ضمان بيع قطع الغيار' : 'Parts Warranty' };
            text += ' - ' + (subMap[req.acquisition_sub_type] || req.acquisition_sub_type);
        }
        if (req.installation_date2) text += (isRTL ? ' (تركيب: ' : ' (Install: ') + formatDate(req.installation_date2) + ')';
        return text;
    } else if (type === 'Service Contract') {
        var text = isRTL ? 'عقد صيانة' : 'Service Contract';
        if (req.acquisition_sub_type) {
            var subMap2 = { 'UPA Contract': isRTL ? 'عقد هيئة الشراء الموحد' : 'UPA Contract', 'Direct Contract': isRTL ? 'عقد مباشر' : 'Direct Contract' };
            text += ' - ' + (subMap2[req.acquisition_sub_type] || req.acquisition_sub_type);
        }
        if (req.contract_number) text += (isRTL ? ' (عقد: ' : ' (Contract: ') + req.contract_number + ')';
        return text;
    } else if (type === 'Part Sales') {
        return isRTL ? 'بيع قطع غيار' : 'Part Sales';
    } else if (type === 'Local Repair Parts') {
        return isRTL ? 'إصلاح محلي' : 'Local Repair Parts';
    } else if (type === 'Tools') {
        return isRTL ? 'أدوات' : 'Tools';
    }
    return type || '-';
}

function buildStatusBar(req) {
    var status = req.status;
    var branch = req.branch || 'Cairo';
    var isAlex = (branch === 'Alex');
    var steps, doneIndex = 0;

    if (isAlex) {
        steps = [translate('dashboard.steps.dept_manager') || 'Dept Manager', translate('dashboard.steps.service') || 'Service', translate('dashboard.steps.finance') || 'Finance', translate('dashboard.steps.warehouse') || 'Warehouse'];
        if (status === 'Fulfilled') doneIndex = 4;
        else if (status === 'Pending Warehouse') doneIndex = 3;
        else if (status === 'Pending Finance') doneIndex = 2;
        else if (status === 'Pending Service') doneIndex = 1;
        else if (status === 'Pending Dept Manager') doneIndex = 0;
        else if (status && status.indexOf('Rejected') !== -1) {
            if (status.indexOf('Dept Manager') !== -1) doneIndex = 0;
            else if (status.indexOf('Service') !== -1) doneIndex = 1;
            else if (status.indexOf('Finance') !== -1) doneIndex = 2;
            else if (status.indexOf('Warehouse') !== -1) doneIndex = 3;
        }
    } else {
        steps = [translate('dashboard.steps.service') || 'Service', translate('dashboard.steps.finance') || 'Finance', translate('dashboard.steps.warehouse') || 'Warehouse'];
        if (status === 'Fulfilled') doneIndex = 3;
        else if (status === 'Pending Warehouse') doneIndex = 2;
        else if (status === 'Pending Finance') doneIndex = 1;
        else if (status === 'Pending Service') doneIndex = 0;
        else if (status && status.indexOf('Rejected') !== -1) {
            if (status.indexOf('Service') !== -1) doneIndex = 0;
            else if (status.indexOf('Finance') !== -1) doneIndex = 1;
            else if (status.indexOf('Warehouse') !== -1) doneIndex = 2;
        }
    }

    var rejected = status && status.indexOf('Rejected') !== -1;
    var html = '<div class="status-bar">';
    for (var i = 0; i < steps.length; i++) {
        var isDone = i < doneIndex;
        var isActive = i === doneIndex && !rejected && status !== 'Fulfilled' && status !== 'Pending Dept Manager';
        var isRej = rejected && i === doneIndex;
        var isManagerWaiting = isAlex && i === 0 && status === 'Pending Dept Manager' && !isDone;
        if (i > 0) html += '<div class="step-line' + (isDone ? ' done' : (isManagerWaiting ? ' manager-step' : '')) + '"></div>';
        var circleClass = '', labelClass = '', circleContent = '';
        if (isDone) { circleClass = ' done'; labelClass = ' done'; circleContent = '✓'; }
        else if (isRej) { circleClass = ' rejected'; labelClass = ' rejected'; }
        else if (isActive) { circleClass = ' active'; labelClass = ' active'; }
        else if (isManagerWaiting) { circleClass = ' manager-step'; labelClass = ' manager-step'; }
        html += '<div class="step"><div class="step-circle' + circleClass + '">' + circleContent + '</div><div class="step-label' + labelClass + '">' + steps[i] + '</div></div>';
    }
    return html + '</div>';
}

            allRequests = data;
            var pending = data.filter(function(r) { return r.status === 'Pending Finance'; });

function applyFilter() {
    var name = document.getElementById('filter_name').value.toLowerCase();
    var dept = document.getElementById('filter_dept').value;
    var from = document.getElementById('filter_from').value;
    var to = document.getElementById('filter_to').value;
    var status = document.getElementById('filter_status').value;
    var filtered = allRequests.filter(function(req) {
        var matchName = !name || ((req.customer_name && req.customer_name.toLowerCase().indexOf(name)!==-1) || (req.organization_name && req.organization_name.toLowerCase().indexOf(name)!==-1));
        var matchDept = !dept || req.department_name === dept;
        var matchStatus = !status || req.status === status;
        var reqDate = req.request_date ? String(req.request_date).substring(0,10) : '';
        return matchName && matchDept && matchStatus && (!from || reqDate >= from) && (!to || reqDate <= to);
    });
    Promise.all(filtered.map(function(req) { return fetch('/approvals/details/' + req.id).then(function(r) { return r.json(); }); })).then(function(results) { renderCards(results); });
}

function clearFilter() {
    document.getElementById('filter_name').value = '';
    document.getElementById('filter_dept').value = '';
    document.getElementById('filter_from').value = '';
    document.getElementById('filter_to').value = '';
    document.getElementById('filter_status').value = 'Pending Finance';
    var pending = allRequests.filter(function(r) { return r.status === 'Pending Finance'; });
    renderList(pending);
}

function renderList(list) {
    if (!list.length) {
        document.getElementById('requests-list').innerHTML = '<div class="card"><p>' + translate('dashboard.no_requests') + '</p></div>';
        return;
    }
    Promise.all(list.map(function(req) { return fetch('/approvals/details/' + req.id).then(function(r) { return r.json(); }); })).then(function(results) { renderCards(results); });
}

function renderCards(results) {
    var el = document.getElementById('requests-list');
    el.innerHTML = '';
    results.forEach(function(data) { buildCard(data.request, data.items); });

}

            </div>
            <div id="msg-${req.id}"></div>
            <button class="btn-approve" onclick="approveFinance(${req.id})" data-i18n="finance_approval.approve">Approve</button>
            <button class="btn-reject" onclick="showReject(${req.id})" data-i18n="finance_approval.reject">Reject</button>
        `;
    }

    var displayDate = req.request_date ? formatDate(req.request_date) : '';

    var div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
        <h3 style="color:#1a3a5c;margin:0 0 5px">${translate('common.request')} ${displayDate} - #${req.id} - ${req.customer_name}</h3>
        <p style="color:#555;font-size:13px"><b>${translate('common.date')}:</b> ${displayDate} | <b>${translate('common.department')}:</b> ${req.department_name || '-'} | <b>${translate('common.status')}:</b> ${req.status}</p>
        ${buildStatusBar(req)}${rejectHtml}
        <h4>${translate('common.request_details')}</h4>
        <table>
            <tr><td style="background:#f5f7fa;width:40%"><b>${translate('common.organization_code')}</b></td><td>${req.organization_code || '-'}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.organization_name')}</b></td><td>${req.organization_name || '-'}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.department')}</b></td><td>${req.department_name || '-'}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.acquisition_type')}</b></td><td>${acqDisplay}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.request_date')}</b></td><td>${displayDate}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.temporary_custody')}</b></td><td>${req.temporary_custody ? 'Yes' : 'No'}</td></tr>
        </table>
        <h4>${translate('common.parts')}</h4>${itemsHtml}
        <h4>${translate('common.notes')}</h4>${renderNotesHtml(req)}
        ${renderOutsideHoursHtml(req)}
        <h4>${translate('common.signatures')}</h4>
        <table>
            <tr><td style="background:#f5f7fa;width:40%"><b>${translate('common.requester')}</b></td><td>${sigWithDate(req.requester_signature, req.requester_signature_date)}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.dept_manager')}</b></td><td>${renderDeptManagerSignature(req)}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.service')}</b></td><td>${sigWithDate(req.service_signature, req.service_signature_date)}${req.manager_approved_service_signature ? '<br><span style="color:#6c3483">(' + translate('common.manager_override') + ': ' + req.manager_approved_service_signature + ')</span>' : ''}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.finance')}</b></td><td>${sigWithDate(req.finance_signature, req.finance_signature_date)}${req.manager_approved_finance_signature ? '<br><span style="color:#6c3483">(' + translate('common.manager_override') + ': ' + req.manager_approved_finance_signature + ')</span>' : ''}</td></tr>
            <tr><td style="background:#f5f7fa"><b>${translate('common.warehouse')}</b></td><td>${sigWithDate(req.engineer_signature, req.warehouse_signature_date)}</td></tr>
        </table>
        ${req.manager_approved_service_comment ? '<h4>' + translate('common.manager_override') + ' (' + translate('common.service') + ')</h4><div class="notes-display">' + req.manager_approved_service_comment + '</div>' : ''}
        ${req.manager_approved_finance_comment ? '<h4>' + translate('common.manager_override') + ' (' + translate('common.finance') + ')</h4><div class="notes-display">' + req.manager_approved_finance_comment + '</div>' : ''}
        ${actionHtml}
    `;
    document.getElementById('requests-list').appendChild(div);
    autoFillSignature();
}

function showReject(id) { document.getElementById('rej-' + id).classList.add('show'); }
function cancelReject(id) { document.getElementById('rej-' + id).classList.remove('show'); document.getElementById('rej-reason-' + id).value = ''; document.getElementById('rej-sig-' + id).value = ''; }

function approveFinance(id) {
    var sig = document.getElementById('sig-' + id).value.trim();
    var notesEl = document.getElementById('finance-notes-' + id);
    var notes = notesEl ? notesEl.value.trim() : '';
    var msg = document.getElementById('msg-' + id);
    if (!sig) { msg.className = 'error'; msg.innerHTML = translate('common.error') + ': ' + translate('finance_approval.signature') + ' ' + translate('common.required'); return; }
    if (!/^[a-zA-Z\u0600-\u06FF\s]+$/.test(sig)) { msg.className = 'error'; msg.innerHTML = translate('common.error') + ': ' + translate('finance_approval.letters_only'); return; }
    fetch('/approvals/finance/' + id, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'action=approve&finance_signature=' + encodeURIComponent(sig) + '&finance_notes=' + encodeURIComponent(notes)
    })
    .then(function(r) { return r.json(); }).then(function(data) {
        if (data.success) { msg.className = 'success'; msg.innerHTML = '✓ ' + translate('messages.request_approved') + ' ' + translate('common.please_wait'); setTimeout(function() { loadRequests(); }, 1500); }
        else { msg.className = 'error'; msg.innerHTML = data.error || translate('common.error'); }
    });
}

function confirmReject(id) {
    var reason = document.getElementById('rej-reason-' + id).value.trim();
    var sig = document.getElementById('rej-sig-' + id).value.trim();
    var msg = document.getElementById('msg-' + id);
    if (!reason) { msg.className = 'error'; msg.innerHTML = translate('common.error') + ': ' + translate('finance_approval.rejection_reason') + ' ' + translate('common.required'); return; }
    if (!sig) { msg.className = 'error'; msg.innerHTML = translate('common.error') + ': ' + translate('finance_approval.signature') + ' ' + translate('common.required'); return; }
    if (!/^[a-zA-Z\u0600-\u06FF\s]+$/.test(sig)) { msg.className = 'error'; msg.innerHTML = translate('common.error') + ': ' + translate('finance_approval.letters_only'); return; }
    fetch('/approvals/finance/' + id, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'action=reject&rejection_reason=' + encodeURIComponent(reason) + '&reject_signature=' + encodeURIComponent(sig) })
        .then(function(r) { return r.json(); }).then(function(data) {
            if (data.success) { msg.className = 'success'; msg.innerHTML = '✓ ' + translate('messages.request_rejected') + ' ' + translate('common.please_wait'); setTimeout(function() { loadRequests(); }, 1500); }
            else { msg.className = 'error'; msg.innerHTML = data.error || translate('common.error'); }
        });
}

function autoFillSignature() {
    fetch('/api/user')
        .then(function(response) { return response.json(); })
        .then(function(data) {
            if (data && data.name) {
                document.querySelectorAll('input[id^="sig-"]').forEach(function(f) { f.value = data.name; });
                document.querySelectorAll('input[id^="rej-sig-"]').forEach(function(f) { f.value = data.name; });
            }
        })
        .catch(function(err) { console.log('Could not auto-fill signature:', err); });
}

document.addEventListener('DOMContentLoaded', function() {
    var tries = 0;
    var waitForLanguage = setInterval(function() {
        tries++;
        var ready = typeof translations !== 'undefined' && translations[currentLanguage] && Object.keys(translations[currentLanguage]).length > 0;
        if (ready || tries > 40) { clearInterval(waitForLanguage); loadRequests(); }
    }, 100);
});
</script>
</body>
</html>
