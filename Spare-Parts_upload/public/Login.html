<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    background: #0a1628;
    overflow: hidden;
}

.login-side {
    width: 420px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 45px;
    background: white;
    position: relative;
    z-index: 2;
    box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1);
}

.login-box { width: 100%; max-width: 340px; margin: 0 auto; }

.login-box .app-title {
    font-size: 22px;
    font-weight: 700;
    color: #1a3a5c;
    text-align: center;
    margin-bottom: 3px;
    letter-spacing: 1px;
}
.login-box .app-title .highlight { color: #c8a84b; }

.login-box .app-subtitle {
    text-align: center;
    color: #888;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.login-box .welcome-text { margin-bottom: 20px; }
.login-box .welcome-text h2 { font-size: 24px; color: #1a3a5c; font-weight: 700; }
.login-box .welcome-text p { color: #888; font-size: 13px; margin-top: 3px; }

.form-group { margin-bottom: 15px; position: relative; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; }

/* SVG input icons */
.form-group .input-icon {
    position: absolute;
    left: 14px;
    top: 38px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}
.form-group .input-icon svg {
    width: 18px;
    height: 18px;
    stroke: #999;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.form-group input {
    width: 100%;
    padding: 12px 14px 12px 42px;
    border: 2px solid #e8ecf1;
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.3s ease;
    background: #f8f9fa;
    color: #333;
}
.form-group input:focus {
    border-color: #1a3a5c;
    outline: none;
    box-shadow: 0 0 0 4px rgba(26, 58, 92, 0.08);
    background: white;
}
.form-group input:focus + .input-icon svg,
.form-group input:focus ~ .input-icon svg {
    stroke: #1a3a5c;
}
.form-group input::placeholder { color: #bbb; font-size: 13px; }

.form-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.remember-me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; cursor: pointer; }
.remember-me input[type="checkbox"] { width: 17px; height: 17px; accent-color: #1a3a5c; cursor: pointer; }
.forgot-password { font-size: 13px; color: #1a3a5c; text-decoration: none; font-weight: 600; transition: color 0.3s; }
.forgot-password:hover { color: #c8a84b; }

.login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #1a3a5c, #2c5f7e);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    letter-spacing: 1px;
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26, 58, 92, 0.3); }
.login-btn:active { transform: translateY(0); }
.login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

.login-btn .loading-spinner {
    display: inline-block;
    width: 18px; height: 18px;
    border: 3px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s ease-in-out infinite;
    vertical-align: middle;
    margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-message {
    background: #fee2e2;
    color: #dc2626;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    border-left: 4px solid #dc2626;
    align-items: center;
    gap: 8px;
}
.error-message.show { display: flex; }
.error-message svg {
    width: 16px;
    height: 16px;
    stroke: #dc2626;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
}

.footer-copyright {
    text-align: center;
    margin-top: 20px;
    font-size: 11px;
    color: #ccc;
    border-top: 1px solid #eee;
    padding-top: 16px;
}

.background-side {
    flex: 1;
    position: relative;
    min-height: 100vh;
    background: url('/background.png') center center / cover no-repeat;
    margin-left: -20px;
}

@media (max-width: 768px) {
    body { flex-direction: column; overflow-y: auto; }
    .login-side { width: 100%; min-height: auto; padding: 30px 25px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); order: 2; }
    .login-box { max-width: 100%; }
    .background-side { min-height: 250px; order: 1; margin-left: 0; }
}
@media (max-width: 480px) {
    .login-side { padding: 20px 15px; order: 2; }
    .login-box .app-title { font-size: 18px; }
    .login-box .welcome-text h2 { font-size: 20px; }
    .form-row { flex-direction: column; gap: 8px; align-items: flex-start; }
    .background-side { min-height: 200px; order: 1; margin-left: 0; }
}
</style>
</head>
<body>

<div class="login-side">
    <div class="login-box">
        <div class="app-title">SPARE <span class="highlight">PARTS</span></div>
        <div class="app-subtitle">Management System</div>

        <div class="welcome-text">
            <h2>Welcome Back</h2>
            <p>Please login to your account to continue</p>
        </div>

        <div id="errorMessage" class="error-message">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="errorText">Invalid credentials</span>
        </div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="email" id="email" name="email" placeholder="Enter your username" required autocomplete="email">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                <span class="input-icon">
                    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
            </div>

            

            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>

        <div class="footer-copyright">
            &copy; 2024 Spare Parts Management System
        </div>
    </div>
</div>

<div class="background-side"></div>

<script>
function handleLogin(event) {
    event.preventDefault();

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value.trim();
    var errorDiv = document.getElementById('errorMessage');
    var errorText = document.getElementById('errorText');
    var loginBtn = document.getElementById('loginBtn');

    errorDiv.classList.remove('show');

    if (!email || !password) {
        errorText.textContent = 'Please enter both email and password.';
        errorDiv.classList.add('show');
        return false;
    }

    loginBtn.disabled = true;
    loginBtn.innerHTML = '<span class="loading-spinner"></span> Please wait...';

    var formData = new FormData();
    formData.append('email', email);
    formData.append('password', password);

    var urlEncoded = new URLSearchParams(formData).toString();

    fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: urlEncoded
    })
    .then(function (response) {
        if (response.redirected) {
            window.location.href = response.url;
            return;
        }
        return response.text();
    })
    .then(function (data) {
        if (data && data.includes('Wrong password')) {
            errorText.textContent = 'Wrong password. Please try again.';
            errorDiv.classList.add('show');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        } else if (data && data.includes('User not found')) {
            errorText.textContent = 'User not found. Please check your email.';
            errorDiv.classList.add('show');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        } else {
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }
    })
    .catch(function (err) {
        console.error('Login error:', err);
        errorText.textContent = 'An error occurred. Please try again.';
        errorDiv.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
    });

    return false;
}

document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('email').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
    document.getElementById('password').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    });
});
</script>
</body>
</html>
